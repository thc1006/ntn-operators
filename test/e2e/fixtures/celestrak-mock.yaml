# In-cluster mock server that stands in for celestrak.org in E2E tests.
# Serves a tiny checked-in OMM JSON fixture on port 80 at /gp.json.
#
# The operator reaches this via its Kubernetes Service DNS name; the
# `--ephemeris-allowed-private-hosts` flag on the manager must list this
# hostname so the SSRF-safe HTTP client lets the connection through.
#
# Fixture content comes from pkg/ephemeris/testdata/oneweb-gp.json — the
# same file pkg/ephemeris's unit tests embed via go:embed, so this mock
# and the CelesTrakFetcher tests share a single source of truth. The
# test suite creates the ConfigMap from that file at runtime, so DO NOT
# inline the JSON here (drift risk). This file only declares Deployment
# + Service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celestrak-mock
  namespace: default
  labels:
    app.kubernetes.io/name: celestrak-mock
    app.kubernetes.io/component: e2e-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celestrak-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celestrak-mock
        app.kubernetes.io/component: e2e-fixture
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: fixture
              mountPath: /usr/share/nginx/html/gp.json
              subPath: gp.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /gp.json
              port: http
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: fixture
          configMap:
            name: celestrak-mock-fixture
            items:
              - key: gp.json
                path: gp.json
---
apiVersion: v1
kind: Service
metadata:
  name: celestrak-mock
  namespace: default
  labels:
    app.kubernetes.io/name: celestrak-mock
    app.kubernetes.io/component: e2e-fixture
spec:
  selector:
    app.kubernetes.io/name: celestrak-mock
  ports:
    - name: http
      port: 80
      targetPort: http
