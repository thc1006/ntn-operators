apiVersion: ntn.operators.dev/v1alpha1
kind: SatelliteEphemeris
metadata:
  labels:
    app.kubernetes.io/name: ntn-operators
    app.kubernetes.io/managed-by: kustomize
  name: oneweb-constellation
spec:
  source:
    type: CelesTrak
    # GROUP=oneweb selects the constellation server-side — no client-side filter.
    url: https://celestrak.org/NORAD/elements/gp.php?GROUP=oneweb&FORMAT=JSON
    refreshInterval: 4h
  passPrediction:
    groundStations:
      - gs-taipei-01
      - gs-hsinchu-01
    minElevation: "10"
    horizon: 24h
