---
# Minimal standalone Prometheus for NTNSlice E2E testing. Not for
# production use: no persistence, no alerting, no TLS.
#
# Scrapes:
#   - the synthetic test-metrics-exporter Service in this namespace
#   - optionally, Open5GS UPF on the host (see 06-open5gs-scrape.yaml
#     for the config snippet once /etc/open5gs/upf.yaml is rebound to
#     a host IP that the cluster can reach).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ntn-e2e
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: test-metrics-exporter
        static_configs:
          - targets:
              - test-metrics-exporter.ntn-e2e.svc:9090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ntn-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ntn-e2e
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ntn-e2e
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
