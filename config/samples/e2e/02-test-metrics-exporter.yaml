---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-metrics-exporter
  namespace: ntn-e2e
  labels:
    app.kubernetes.io/name: test-metrics-exporter
    app.kubernetes.io/component: fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-metrics-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: test-metrics-exporter:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-listen=:9090"
            - "-namespace=default"
            - "-slice=e2e-slice"
            - "-pass-duration=30s"
            - "-gap-duration=30s"
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: test-metrics-exporter
  namespace: ntn-e2e
  labels:
    app.kubernetes.io/name: test-metrics-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: test-metrics-exporter
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
