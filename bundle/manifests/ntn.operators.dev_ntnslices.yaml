---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ntnslices.ntn.operators.dev
spec:
  group: ntn.operators.dev
  names:
    kind: NTNSlice
    listKind: NTNSliceList
    plural: ntnslices
    shortNames:
    - nts
    singular: ntnslice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .status.activePathType
      name: Active Path
      type: string
    - jsonPath: .status.failoverCount
      name: Failovers
      type: integer
    - jsonPath: .status.conditions[?(@.type=="FailoverReady")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NTNSlice manages terrestrial-satellite network slice failover,
          QoS mapping, and session continuity for NTN enterprise services.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NTNSliceSpec defines the desired state of an NTN network slice
              with terrestrial-satellite failover policy.
            properties:
              billing:
                description: billing defines CDR generation parameters.
                properties:
                  satelliteRate:
                    description: satelliteRate is the charging model for satellite
                      path.
                    enum:
                    - per-volume
                    - per-time
                    - per-minute
                    - flat
                    type: string
                  terrestrialRate:
                    description: terrestrialRate is the charging model for terrestrial
                      path.
                    enum:
                    - per-volume
                    - per-time
                    - flat
                    type: string
                type: object
              failoverPolicy:
                description: failoverPolicy defines when and how to switch between
                  paths.
                properties:
                  confirmationSamples:
                    description: |-
                      confirmationSamples is the number of CONSECUTIVE reconcile samples on which
                      the terrestrial triggers must fire before a failover to satellite is taken
                      (production load balancers such as AWS ALB / GCP count consecutive, not
                      windowed, probe results). It absorbs a single-sample blip so one noisy
                      reading does not trip a switch. 1 (the default when unset) preserves the
                      prior immediate-failover behavior; a value of N delays failover by up to
                      (N-1) reconcile intervals. The confirmation counter is kept in memory and
                      resets on any healthy reliable sample; losing it on a controller restart or
                      leader-election handoff only re-requires confirmation (a DELAY), never causes
                      a spurious switch.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  hysteresisMargin:
                    description: |-
                      hysteresisMargin is a dead-band applied to trigger thresholds
                      during switchback evaluation, preventing flapping when metrics
                      oscillate near the threshold. The value uses the same unit as
                      the trigger (dB for RSRP, ms for latency, percent for packetLoss).
                      Example: with trigger "rsrp < -120" and hysteresisMargin "10",
                      failover fires at RSRP < -120, but switchback requires RSRP >= -110.
                    maxLength: 32
                    pattern: ^[0-9]+\.?[0-9]*$
                    type: string
                  minTerrestrialDwell:
                    description: |-
                      minTerrestrialDwell is the minimum time the terrestrial path must be held
                      after a switchback before another failover to satellite may be taken. It
                      bounds sub-minute ping-pong after a hand-back. It is a soft, bounded delay
                      — a genuinely failing terrestrial still fails over once the dwell elapses,
                      so it never indefinitely blocks a real failover. 0 (the default) disables
                      it; 30s–120s is a sane range relative to a LEO pass. A negative value would
                      silently disable the dwell (elapsed < negative is never true), so admission
                      bounds it to [0s, 24h].
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: minTerrestrialDwell must be a non-negative duration
                        no greater than 24h
                      rule: duration(self) >= duration('0s') && duration(self) <=
                        duration('24h')
                  sessionContinuity:
                    default: true
                    description: |-
                      sessionContinuity is accepted for forward compatibility but is NOT enforced by this
                      build: no runtime session preservation is performed during a path switch, so active
                      sessions may drop on failover regardless of this value. It is retained so the intent
                      stays expressible and a future release can honor it (#69); do not rely on it for
                      session survival today. The default stays true only to preserve the field's prior
                      admission behavior — it turns no preservation on.
                    type: boolean
                  switchbackDelay:
                    default: 60s
                    description: |-
                      switchbackDelay is how long to wait after terrestrial recovers
                      before switching back (prevents flapping). A negative value is meaningless
                      here, so admission bounds it to [0s, 24h] (24h is a fat-finger ceiling, far
                      above any LEO-pass-relative value).
                    format: duration
                    type: string
                    x-kubernetes-validations:
                    - message: switchbackDelay must be a non-negative duration no
                        greater than 24h
                      rule: duration(self) >= duration('0s') && duration(self) <=
                        duration('24h')
                  triggers:
                    description: |-
                      triggers defines conditions that initiate failover (OR logic).
                      Format: "metric operator value" (e.g., "rsrp < -120").
                      Validated at admission by the XValidation rule on this type and at runtime by
                      the failover engine (pkg/slice.ParseTrigger).
                      Order is intentionally not significant; set merge semantics are desired.
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 10
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - triggers
                type: object
                x-kubernetes-validations:
                - message: each failoverPolicy.trigger must be 'metric op value' where
                    metric is one of rsrp/latency/packetLoss/terrestrialRSRP/terrestrialLatency/terrestrialPacketLoss,
                    op is one of < <= > >=, and value is a finite decimal (up to 10
                    integer and 10 fraction digits with an optional 2-digit exponent,
                    e.g. 'rsrp < -120'); overflowing forms like '1e9999' are rejected
                    here and, defensively, at runtime
                  rule: self.triggers.all(t, t.matches('^ *(rsrp|latency|packetLoss|terrestrialRSRP|terrestrialLatency|terrestrialPacketLoss)
                    *(<=|>=|<|>) *[-+]?([0-9]{1,10}([.][0-9]{1,10})?|[.][0-9]{1,10})([eE][-+]?[0-9]{1,2})?
                    *$'))
              metricsSource:
                description: |-
                  metricsSource selects where the failover engine reads path quality
                  metrics (RSRP, latency, packet loss) from. When omitted, the
                  controller falls back to annotation-driven simulation for backward
                  compatibility with existing development deployments.
                properties:
                  prometheus:
                    description: |-
                      prometheus configures the Prometheus HTTP API backend.
                      Required when type is 'prometheus'.
                    properties:
                      endpoint:
                        description: endpoint is the base URL of the Prometheus HTTP
                          API.
                        maxLength: 2048
                        minLength: 1
                        pattern: ^https?://
                        type: string
                      queries:
                        description: queries holds the PromQL expressions for each
                          observable metric.
                        properties:
                          latencyMs:
                            description: latencyMs is a PromQL expression returning
                              a scalar in milliseconds.
                            maxLength: 1024
                            type: string
                          packetLossPercent:
                            description: |-
                              packetLossPercent is a PromQL expression returning a scalar in
                              percent (0-100).
                            maxLength: 1024
                            type: string
                          rsrpDbm:
                            description: rsrpDbm is a PromQL expression returning
                              a scalar in dBm.
                            maxLength: 1024
                            type: string
                        type: object
                      queryTimeout:
                        description: |-
                          queryTimeout limits the wall-clock time spent on each individual
                          PromQL fetch; the controller issues up to three fetches per
                          reconcile (one per metric), so the upper bound for a Read is
                          roughly 3x this value. Defaults to 2s when unset.
                        format: duration
                        type: string
                    required:
                    - endpoint
                    - queries
                    type: object
                    x-kubernetes-validations:
                    - message: at least one query must be non-empty
                      rule: size(self.queries.rsrpDbm) > 0 || size(self.queries.latencyMs)
                        > 0 || size(self.queries.packetLossPercent) > 0
                  type:
                    default: annotations
                    description: type is the backend kind.
                    enum:
                    - annotations
                    - prometheus
                    type: string
                type: object
                x-kubernetes-validations:
                - message: prometheus block is required when type is 'prometheus'
                  rule: self.type != 'prometheus' || has(self.prometheus)
              qosMapping:
                description: qosMapping defines QoS parameter mapping between paths.
                properties:
                  maxLatencyBudget:
                    default: 150ms
                    description: |-
                      maxLatencyBudget is the maximum acceptable latency including
                      satellite propagation delay.
                    format: duration
                    type: string
                  satelliteQCI:
                    default: best-effort
                    description: satelliteQCI is the QoS class for the satellite path.
                    enum:
                    - conversational
                    - streaming
                    - interactive
                    - background
                    - best-effort
                    type: string
                  terrestrial5QI:
                    description: terrestrial5QI is the 5G QoS Identifier for the terrestrial
                      path.
                    maximum: 255
                    minimum: 1
                    type: integer
                type: object
              satellitePath:
                description: satellitePath defines the failover satellite connectivity.
                properties:
                  apn:
                    description: apn is the Access Point Name.
                    maxLength: 253
                    type: string
                  ephemerisRef:
                    description: |-
                      ephemerisRef is the name of the SatelliteEphemeris resource used to determine
                      satellite pass availability. The referenced ephemeris is treated as a
                      CONSTELLATION POOL: the satellite path is available whenever ANY tracked member
                      is overhead and deliverable — the slice is deliberately not pinned to one NORAD,
                      because LEO members hand over. Which member a given cell broadcasts is
                      NTNCellConfig.ephemerisNoradID's concern, not this path's. See ADR-0008.
                    maxLength: 253
                    minLength: 1
                    type: string
                  priority:
                    description: priority is the path priority.
                    enum:
                    - primary
                    - failover
                    type: string
                  provider:
                    description: provider is the network operator name (e.g., "chunghwa-telecom").
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - ephemerisRef
                - priority
                - provider
                type: object
              security:
                description: security defines handover security requirements.
                properties:
                  authOnHandover:
                    default: re-authenticate
                    description: authOnHandover defines authentication behavior during
                      path switch.
                    enum:
                    - re-authenticate
                    - continue
                    type: string
                  encryptionLevel:
                    default: AES-256
                    description: encryptionLevel specifies the encryption standard.
                    enum:
                    - AES-128
                    - AES-256
                    - SNOW3G
                    - ZUC
                    type: string
                type: object
              tenant:
                description: tenant is the organization or entity that owns this slice.
                maxLength: 253
                minLength: 1
                type: string
              terrestrialPath:
                description: terrestrialPath defines the primary terrestrial connectivity.
                properties:
                  apn:
                    description: apn is the Access Point Name.
                    maxLength: 253
                    type: string
                  priority:
                    description: priority is the path priority.
                    enum:
                    - primary
                    - failover
                    type: string
                  provider:
                    description: provider is the network operator name (e.g., "chunghwa-telecom").
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - priority
                - provider
                type: object
            required:
            - failoverPolicy
            - satellitePath
            - tenant
            - terrestrialPath
            type: object
            x-kubernetes-validations:
            - message: terrestrialPath.priority must be 'primary'
              rule: self.terrestrialPath.priority == 'primary'
            - message: satellitePath.priority must be 'failover'
              rule: self.satellitePath.priority == 'failover'
          status:
            properties:
              activePathType:
                description: activePathType is the currently active network path.
                enum:
                - terrestrial
                - satellite
                - unavailable
                type: string
              appliedEncryption:
                description: appliedEncryption is the encryption level in effect for
                  the current path.
                type: string
              appliedQoS:
                description: appliedQoS summarizes the QoS mapping in effect for the
                  current path.
                type: string
              billingMode:
                description: billingMode is the billing model active for the current
                  path.
                type: string
              conditions:
                description: conditions represent the current state of the slice.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contactCandidate:
                description: |-
                  contactCandidate is the constellation member behind the current FailoverReady
                  evaluation: which satellite, seen from which ground station, over which window, and
                  on element data of what age. FailoverReady alone says a contact opportunity exists
                  but not which one, so an operator cannot tell a healthy handover between members
                  from the same member re-evaluated, and cannot audit the decision after the fact.

                  It is a CONTACT OPPORTUNITY, not delivered service: nothing here says the slice's
                  serving cell is configured for this member. Cleared when no candidate can be proven,
                  so a stale entry can never outlive the condition it explains (ADR-0008).
                properties:
                  aos:
                    description: aos and los bound the pass window this candidate
                      is currently inside.
                    format: date-time
                    type: string
                  groundStation:
                    description: |-
                      groundStation is the GroundStationLifecycle this window was predicted for. A pass is
                      only meaningful relative to an observer, so a candidate without one is not auditable.
                    type: string
                  los:
                    format: date-time
                    type: string
                  noradID:
                    description: noradID is the canonical satellite identity. satellite
                      is a display label only.
                    type: integer
                  propagatedEpochUnixMs:
                    description: propagatedEpochUnixMs is the future epoch the state
                      was propagated TO.
                    format: int64
                    type: integer
                  satellite:
                    description: |-
                      satellite is the externally sourced display name, bounded and rune-safe. Not unique:
                      correlate on noradID.
                    maxLength: 64
                    type: string
                  selectionReason:
                    description: |-
                      selectionReason names the rule that chose this candidate over its siblings, so the
                      choice is reproducible from the status alone.
                    type: string
                  sourceEpochUnixMs:
                    description: |-
                      sourceEpochUnixMs is the epoch of the element set the window was propagated FROM —
                      the age that decides deliverability, not the propagation target below. Absent when no
                      propagatedStates entry matches noradID.
                    format: int64
                    type: integer
                  validUntil:
                    description: |-
                      validUntil is when this candidate stops being usable: the EARLIER of the pass ending
                      and its element set aging past the delivery freshness bound. Reporting only LOS would
                      promise a window the runtime push would refuse to use before it closes.
                    format: date-time
                    type: string
                required:
                - noradID
                type: object
              failoverCount:
                description: failoverCount is the total number of failover events
                  since creation.
                type: integer
              lastFailover:
                description: lastFailover is the timestamp of the last failover event.
                format: date-time
                type: string
              lastSwitchbackTime:
                description: |-
                  lastSwitchbackTime is when the slice last switched back to terrestrial from an
                  available satellite (a quality-driven hand-back). It is persisted so the anti-flap
                  minimum-terrestrial-dwell survives a controller restart or leader-election handoff:
                  the in-memory flap clock resets on handoff, and without this a re-degradation within
                  the dwell window could switch to satellite earlier than the dwell intended. The other
                  flap clocks stay in-memory (losing them only delays a switch, never advances one).
                format: date-time
                type: string
              sessionCount:
                description: sessionCount is the number of active sessions on this
                  slice.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
