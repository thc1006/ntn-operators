name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # Required for cosign keyless signing via OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Setup ko
        uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372be43b8aaf1a781145e41e40d45c4a91e0 # v3.8.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e3c8f0c08 # v0.18.0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # --- Build locally, scan, then push (scan-before-publish) ---

      - name: Build local image with ko (no push)
        id: ko-local
        env:
          KO_DOCKER_REPO: ko.local
        run: |
          LOCAL_IMAGE=$(ko build ./cmd/ --local --bare)
          echo "LOCAL_IMAGE=${LOCAL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Local image: ${LOCAL_IMAGE}"

      - name: Scan image for vulnerabilities (Trivy)
        # Pin to known-safe SHA after March 2026 supply chain compromise.
        # See: https://www.stepsecurity.io/blog/trivy-compromised-a-second-time
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (safe)
        with:
          image-ref: ${{ steps.ko-local.outputs.LOCAL_IMAGE }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'

      - name: Push multi-arch image to GHCR
        id: ko-push
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          DIGEST=$(ko build ./cmd/ \
            --platform=linux/amd64,linux/arm64 \
            --tags=${{ github.ref_name }},latest \
            --bare)
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image digest: ${DIGEST}"

      - name: Scan multi-arch image per platform (Trivy)
        # Scan both platforms of the pushed image to catch arch-specific CVEs.
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "=== Scanning ${platform} ==="
            trivy image \
              --platform "${platform}" \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --timeout 10m \
              ${{ steps.ko-push.outputs.DIGEST }}
          done

      - name: Sign image with cosign (keyless OIDC)
        run: cosign sign --yes ${{ steps.ko-push.outputs.DIGEST }}

      - name: Generate SBOM (SPDX)
        run: |
          syft ${{ steps.ko-push.outputs.DIGEST }} \
            -o spdx-json=sbom.spdx.json

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ steps.ko-push.outputs.DIGEST }}

      # --- Helm chart packaging ---

      - name: Install Helm
        env:
          HELM_VERSION: v3.17.4
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          curl -fsSL -o "$TMPDIR/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$TMPDIR/helm.tar.gz.sha256" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256"
          echo "$(cat "$TMPDIR/helm.tar.gz.sha256")  $TMPDIR/helm.tar.gz" | sha256sum -c -
          tar -xzf "$TMPDIR/helm.tar.gz" -C "$TMPDIR"
          sudo mv "$TMPDIR/linux-amd64/helm" /usr/local/bin/helm
          helm version

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" dist/chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" dist/chart/Chart.yaml

      - name: Package and push Helm chart to OCI
        run: |
          helm package dist/chart --version ${{ steps.version.outputs.VERSION }}
          helm push ntn-operators-${{ steps.version.outputs.VERSION }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            ntn-operators-${{ steps.version.outputs.VERSION }}.tgz
            sbom.spdx.json
