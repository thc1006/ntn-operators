name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.custom-gcl.yml'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.custom-gcl.yml'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache golangci-lint binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin/golangci-lint*
          key: golangci-lint-${{ hashFiles('.custom-gcl.yml', '.golangci.yml', 'go.sum') }}

      - name: Run linter
        run: make lint

  # Gate: every `uses: org/repo@<ref>` in .github/workflows/ must be
  # a valid SHA-pinned commit. Catches the failure mode from PR #97
  # where action SHAs were typo'd and slipped past human review.
  # See #107 and hack/check-action-shas.sh.
  check-action-shas:
    name: Action SHAs pinned
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate action SHAs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./hack/check-action-shas.sh
