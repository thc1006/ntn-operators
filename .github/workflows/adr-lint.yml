name: ADR lint

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - 'hack/check-adr-index.sh'
      - '.github/workflows/adr-lint.yml'
  pull_request:
    paths:
      - 'docs/adr/**'
      - 'hack/check-adr-index.sh'
      - '.github/workflows/adr-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adr-lint:
    name: ADR index + numbering
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ADR index and numbering
        run: ./hack/check-adr-index.sh
