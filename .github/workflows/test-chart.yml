name: Test Chart

on:
  push:
    branches: [main]
    paths:
      - 'dist/chart/**'
      - 'bundle/**'
      - 'config/crd/**'
      - 'cmd/**'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'dist/chart/**'
      - 'bundle/**'
      - 'config/crd/**'
      - 'cmd/**'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-chart:
    name: Helm lint + deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fail fast (before the heavy Go/Kind setup) if the OLM bundle CRDs
      # have drifted from config/crd/bases/. Mirrors nephio-verify-sync;
      # catches the gap that shipped a stale bundle CRD before #147.
      - name: Verify OLM bundle CRDs are in sync (drift check)
        run: make bundle-verify-sync

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Create Kind cluster
        run: kind create cluster

      - name: Build and load image
        run: |
          make docker-build IMG=controller:latest
          kind load docker-image controller:latest

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: ./bin/helm lint ./dist/chart

      - name: Verify chart HA invariants (PDB replicas gate + shutdown grace)
        run: |
          set -euo pipefail
          H=./bin/helm
          count() { $H template t ./dist/chart --set manager.replicas="$1" --set podDisruptionBudget.enable=true | grep -c '^kind: PodDisruptionBudget' || true; }
          [ "$(count 1)" = "0" ] || { echo "FAIL: replicas=1 must render 0 PDBs (a minAvailable:1 PDB over 1 replica deadlocks node drains)"; exit 1; }
          [ "$(count 2)" = "1" ] || { echo "FAIL: replicas=2 must render 1 PDB"; exit 1; }
          [ "$(count 3)" = "1" ] || { echo "FAIL: replicas=3 must render 1 PDB"; exit 1; }
          echo "PDB replicas gate OK (1->0, 2->1, 3->1)"
          # Threshold shares the SAME source as production: parse leaderRenewDeadline (seconds) from
          # cmd/main.go so the chart headroom check cannot drift from the Go constant.
          renew=$(grep -oE 'leaderRenewDeadline = [0-9]+ \* time\.Second' cmd/main.go | grep -oE '[0-9]+' | head -1)
          [ -n "$renew" ] || { echo "FAIL: could not read leaderRenewDeadline from cmd/main.go"; exit 1; }
          grace=$($H template t ./dist/chart | grep -oE 'terminationGracePeriodSeconds: [0-9]+' | head -1 | grep -oE '[0-9]+$')
          { [ -n "$grace" ] && [ "$grace" -ge "$renew" ]; } || { echo "FAIL: chart terminationGracePeriodSeconds='$grace' must be >= RenewDeadline ${renew}s"; exit 1; }
          echo "chart terminationGracePeriodSeconds=$grace (>= RenewDeadline ${renew}s) OK"

      # F7 (#228): the egress NetworkPolicy was never rendered or validated in CI, so a regression that
      # dropped DNS/UDP or an egress port would ship silently. Assert it renders only when enabled, carries
      # the egress rules the operator depends on, and is accepted by the live API server (server-side
      # dry-run — exercises it structurally without needing a NetworkPolicy-enforcing CNI).
      - name: Verify NetworkPolicy renders + API server accepts it (F7)
        run: |
          set -euo pipefail
          H=./bin/helm
          # (a) default (enable=false) renders NO NetworkPolicy.
          off=$($H template t ./dist/chart -n default | grep -c '^kind: NetworkPolicy' || true)
          [ "$off" = "0" ] || { echo "FAIL: networkPolicy.enable=false must render 0 NetworkPolicy, got $off"; exit 1; }
          # (b) enable=true renders the policy; the live API server normalizes it (server-side dry-run) to
          # JSON, then jq asserts the required rules SCOPED TO .spec.egress. Scoping to .spec.egress (not a
          # whole-YAML grep) means an ingress port cannot satisfy an egress assertion, and a port dropped
          # from egress but still present in ingress is still caught — the exact ingress/egress confusion a
          # substring grep would miss. Ingress and egress are opposite directions; for an egress-isolated pod
          # only .spec.egress is the outbound allowlist.
          np=$($H template t ./dist/chart -n default --set networkPolicy.enable=true \
                 --show-only templates/manager/networkpolicy.yaml)
          echo "$np" | grep -q '^kind: NetworkPolicy' || { echo "FAIL: enable=true must render a NetworkPolicy"; exit 1; }
          obj=$(printf '%s\n' "$np" | kubectl apply --dry-run=server -f - -o json)
          # A NetworkPolicy egress rule matches ports AND to; a rule with no 'to' allows the port to ALL
          # destinations. The chart's default rules for these ports are 'to'-less (broad), so require each
          # required port to appear in a 'to'-LESS egress rule — otherwise a mutation that scopes the 443
          # rule to some ipBlock CIDR would still list 443/TCP yet block apiserver/CelesTrak/Space-Track.
          echo "$obj" | jq -e '
            .kind == "NetworkPolicy"
            and (.spec.policyTypes | index("Egress"))
            and ([ .spec.egress[]? | select((.to // []) | length == 0) | .ports[]? | "\(.port)/\(.protocol // "TCP")" ] as $p
                 | ($p | index("53/TCP")) and ($p | index("53/UDP"))
                 and ($p | index("443/TCP")) and ($p | index("9090/TCP")) and ($p | index("8001/TCP")))
          ' >/dev/null \
            || { echo "FAIL: .spec.egress must allow DNS 53 TCP+UDP, 443/TCP, 9090/TCP, 8001/TCP to ALL destinations (a 'to'-less rule)"; echo "$obj" | jq '.spec.egress'; exit 1; }
          echo "NetworkPolicy egress assertion OK (server-normalized, 'to'-less .spec.egress: 53 TCP+UDP, 443/9090/8001 TCP)"

      - name: Deploy manager via Helm
        run: make helm-deploy IMG=controller:latest HELM_EXTRA_ARGS="--set manager.image.pullPolicy=Never"

      - name: Check Helm release status
        run: make helm-status
