name: Test Chart

on:
  push:
    branches: [main]
    # Broad on purpose: this job is the ONLY one that runs the HA suite (make test-e2e-ha, tag e2e_ha), so it
    # must re-run whenever anything the HA behaviour depends on changes — the chart topology, the manager
    # Deployment/RBAC, leader-election/readiness (cmd), the controllers + API used by the reconcile-proof, the
    # provider, controller-runtime (go.mod), the HA test itself, or the topology checker. The general E2E job
    # covers test/** but only runs -tags=e2e, which does NOT compile ha_test.go.
    paths:
      - 'dist/chart/**'
      - 'bundle/**'
      - 'config/crd/**'
      - 'config/manager/**'
      - 'config/rbac/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'test/e2e/**'
      - 'hack/verify_ha_topology*.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    # Broad on purpose: this job is the ONLY one that runs the HA suite (make test-e2e-ha, tag e2e_ha), so it
    # must re-run whenever anything the HA behaviour depends on changes — the chart topology, the manager
    # Deployment/RBAC, leader-election/readiness (cmd), the controllers + API used by the reconcile-proof, the
    # provider, controller-runtime (go.mod), the HA test itself, or the topology checker. The general E2E job
    # covers test/** but only runs -tags=e2e, which does NOT compile ha_test.go.
    paths:
      - 'dist/chart/**'
      - 'bundle/**'
      - 'config/crd/**'
      - 'config/manager/**'
      - 'config/rbac/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'test/e2e/**'
      - 'hack/verify_ha_topology*.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: this job only reads the repo (checkout, build, Kind, Helm).
permissions:
  contents: read

jobs:
  test-chart:
    name: Helm lint + deploy
    runs-on: ubuntu-24.04
    # Cap a hung Kind/Docker/Helm/API-poll so the job fails fast rather than drifting to GitHub's 6h ceiling.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs PR-modifiable Makefile/scripts/Go tests; do not leave the checkout token on disk.
          persist-credentials: false

      # Set Go up FIRST so every `make` below uses the pinned toolchain from go.mod. Otherwise the
      # Makefile's parse-time `$(shell go env ...)` runs against the runner's system Go and can trigger a
      # toolchain download before setup-go warms its cache.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Fail fast (before the heavy Kind setup) if the OLM bundle CRDs have drifted from
      # config/crd/bases/. Mirrors nephio-verify-sync; catches the stale-bundle-CRD gap from before #147.
      - name: Verify OLM bundle CRDs are in sync (drift check)
        run: make bundle-verify-sync

      # BIDIRECTIONAL generated-artifact verification: regenerate everything, then fail if the tree is
      # dirty. bundle-verify-sync above only checks source->bundle; this also catches a bundle CRD with no
      # source (stale/renamed), a source CRD with no chart template (sync-chart-crds.sh is now fail-closed),
      # and any stale api/DeepCopy or chart CRD — `make bundle` removes stale bundle CRDs so `git diff`
      # sees the removal. Verified locally that the generators leave a clean tree.
      - name: Verify generated artifacts are committed (no drift)
        run: |
          set -euo pipefail
          make manifests generate bundle
          git diff --exit-code -- api config/crd bundle/manifests dist/chart/templates/crd \
            || { echo "FAIL: generated artifacts are stale — run 'make manifests generate bundle' and commit"; exit 1; }

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Create Kind cluster
        run: kind create cluster

      # Build the manager on the host so the compile reuses setup-go's persistent build cache
      # (~/.cache/go-build, keyed on go.sum and shared across jobs) — a warm cache turns the ~60s
      # in-container recompile into a few seconds. Go 1.20+ ships no precompiled stdlib, so an
      # in-container build (make docker-build) has a cold cache every run. CGO_ENABLED=0 keeps it static
      # (runs in distroless); the arch is left native (= runner = Kind node); ./cmd/ is the exact package
      # ko ships at release, so this is a functionally identical binary in the same distroless base.
      - name: Build manager binary (host Go cache)
        run: |
          mkdir -p /tmp/img
          CGO_ENABLED=0 GOOS=linux go build -o /tmp/img/manager ./cmd/

      # Package the static binary into the distroless runtime PRODUCTION actually ships. Production images
      # are built by ko (release.yml; base = .ko.yaml defaultBaseImage), NOT by the repo Dockerfile, so this
      # base is pinned to the SAME digest as .ko.yaml and Dockerfile — a bump moves all three together and
      # the HA suite tests the runtime that ships. A /tmp context sidesteps .dockerignore, which excludes bin/.
      - name: Package + load image into Kind
        run: |
          cat > /tmp/img/Dockerfile <<'EOF'
          FROM gcr.io/distroless/static:nonroot@sha256:f7f8f729987ad0fdf6b05eeeae94b26e6a0f613bdf46feea7fc40f7bd72953e6
          WORKDIR /
          COPY manager /manager
          USER 65532:65532
          ENTRYPOINT ["/manager"]
          EOF
          docker build -t controller:latest /tmp/img
          kind load docker-image controller:latest

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart (declared minimum + a current Kubernetes)
        run: |
          set -euo pipefail
          # Lint against the chart's declared MINIMUM (Chart.yaml kubeVersion ">=1.31.0-0"): the Kind node
          # uses a much newer default, so a template using an API/field newer than 1.31 would ship green.
          ./bin/helm lint ./dist/chart --kube-version 1.31.0
          ./bin/helm lint ./dist/chart --kube-version 1.34.0

      - name: Verify chart HA invariants (PDB replicas gate + shutdown grace)
        run: |
          set -euo pipefail
          H=./bin/helm
          # Render each replica variant once; a helm failure aborts (set -e) rather than being swallowed
          # by `|| true`, and only grep's no-match (exit 1) is tolerated — so a broken render cannot read
          # as "0 PDBs" and pass the replicas=1 assertion.
          count() {
            local rendered
            rendered=$("$H" template t ./dist/chart --set manager.replicas="$1" --set podDisruptionBudget.enable=true) || return 1
            grep -c '^kind: PodDisruptionBudget$' <<<"$rendered" || :
          }
          [ "$(count 1)" = "0" ] || { echo "FAIL: replicas=1 must render 0 PDBs (a minAvailable:1 PDB over 1 replica deadlocks node drains)"; exit 1; }
          [ "$(count 2)" = "1" ] || { echo "FAIL: replicas=2 must render 1 PDB"; exit 1; }
          [ "$(count 3)" = "1" ] || { echo "FAIL: replicas=3 must render 1 PDB"; exit 1; }
          echo "PDB replicas gate OK (1->0, 2->1, 3->1)"
          # Threshold shares the SAME source as production: parse leaderRenewDeadline (seconds) from
          # cmd/main.go so the chart headroom check cannot drift from the Go constant.
          renew=$(grep -oE 'leaderRenewDeadline = [0-9]+ \* time\.Second' cmd/main.go | grep -oE '[0-9]+' | head -1)
          [ -n "$renew" ] || { echo "FAIL: could not read leaderRenewDeadline from cmd/main.go"; exit 1; }
          grace=$($H template t ./dist/chart | grep -oE 'terminationGracePeriodSeconds: [0-9]+' | head -1 | grep -oE '[0-9]+$')
          { [ -n "$grace" ] && [ "$grace" -ge "$renew" ]; } || { echo "FAIL: chart terminationGracePeriodSeconds='$grace' must be >= RenewDeadline ${renew}s"; exit 1; }
          echo "chart terminationGracePeriodSeconds=$grace (>= RenewDeadline ${renew}s) OK"
          # Pin the ABSOLUTE HA failover budget. The E2E RTO bounds are self-calibrating (relative to the live
          # Lease's leaseDurationSeconds), so they would silently scale with a leaderLeaseDuration regression
          # (15s -> 120s makes an 8x-slower handoff still pass). Assert the source constant stays within the
          # stated sub-15s active-passive budget (docs/high-availability.md).
          lease=$(grep -oE 'leaderLeaseDuration = [0-9]+ \* time\.Second' cmd/main.go | grep -oE '[0-9]+' | head -1)
          { [ -n "$lease" ] && [ "$lease" -le 15 ]; } || { echo "FAIL: leaderLeaseDuration='$lease's exceeds the pinned 15s HA failover budget"; exit 1; }
          echo "leaderLeaseDuration=${lease}s (<= 15s HA budget) OK"

      # #251 / ADR-0009: the credential-reference admission policy must be OFF by default (turning
      # it on is a real tightening) and, when on, must carry the authorizer check that IS the
      # boundary. A render that silently dropped the authorizer expression would look installed
      # while authorizing nothing, so assert the expression itself, not just the object count.
      - name: Verify credential-ref admission policy (default off, authorizer present when on)
        run: |
          set -euo pipefail
          H=./bin/helm
          # Default render must contain NO policy. Render first so a helm failure aborts here, instead of
          # being swallowed by `|| true` and misread as "0 policies = correctly off"; only grep's no-match
          # (exit 1) is tolerated.
          default_render=$("$H" template t ./dist/chart)
          off=$(grep -c '^kind: ValidatingAdmissionPolicy' <<<"$default_render" || :)
          [ "$off" = "0" ] || { echo "FAIL: credentialRefPolicy must be opt-in; default render produced $off policies"; exit 1; }
          on=$("$H" template t ./dist/chart --set credentialRefPolicy.enable=true \
                 -s templates/admission/credential-ref-policy.yaml)
          # (a) the live API server must ACCEPT the enabled policy (server-side dry-run) — this proves the CEL
          # compiles and the schema/binding are valid on this Kubernetes, not merely that the text is present.
          # The NetworkPolicy step already dry-runs; the admission policy IS the #251/ADR-0009 boundary and must too.
          printf '%s\n' "$on" | kubectl apply --dry-run=server -f - -o name
          # (b) semantic assertions on the CEL boundary — a render that dropped the authorizer check would look
          # installed while authorizing nothing.
          grep -q 'kind: ValidatingAdmissionPolicy$' <<<"$on" || { echo "FAIL: policy not rendered when enabled"; exit 1; }
          grep -q 'kind: ValidatingAdmissionPolicyBinding$' <<<"$on" || { echo "FAIL: binding not rendered when enabled"; exit 1; }
          grep -q "authorizer.group('').resource('secrets')" <<<"$on" || { echo "FAIL: the authorizer check is missing — the policy would authorize nothing"; exit 1; }
          grep -q "check('get').allowed()" <<<"$on" || { echo "FAIL: the authorizer check does not assert 'get' is allowed"; exit 1; }
          grep -q 'failurePolicy: Fail' <<<"$on" || { echo "FAIL: failurePolicy must default to Fail"; exit 1; }
          echo "credential-ref policy OK (off by default; API-server-accepted + authorizer check present when enabled)"

      # #230 item 1: the active-passive HA topology the design relies on was never asserted structurally.
      # A drift that dropped the soft anti-affinity, changed the default replica count, misaligned the PDB
      # selector (so it stops selecting the manager pods → minAvailable silently protects nothing), or picked
      # a rollout strategy that can tear down the healthy version would ship green. Assert the rendered
      # topology holds (hack/verify_ha_topology.py), then SELF-TEST the checker against deliberately-broken
      # renders so a refactor that weakens a guard fails here rather than letting real drift through.
      - name: Verify chart HA topology + self-test the checker (negative controls)
        run: |
          set -euo pipefail
          # verify_ha_topology.py imports PyYAML. ubuntu runners ship it, but make the dependency explicit:
          # use the preinstalled copy, else install a pinned one, rather than silently relying on the image.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
          ./bin/helm template t ./dist/chart -n ntn-system --set podDisruptionBudget.enable=true > /tmp/ha_topology.yaml
          python3 hack/verify_ha_topology.py /tmp/ha_topology.yaml
          python3 hack/verify_ha_topology_selftest.py /tmp/ha_topology.yaml

      # F7 (#228): the egress NetworkPolicy was never rendered or validated in CI, so a regression that
      # dropped DNS/UDP or an egress port would ship silently. Assert it renders only when enabled, carries
      # the egress rules the operator depends on, and is accepted by the live API server (server-side
      # dry-run — exercises it structurally without needing a NetworkPolicy-enforcing CNI).
      - name: Verify NetworkPolicy renders + API server accepts it (F7)
        run: |
          set -euo pipefail
          H=./bin/helm
          # (a) default (enable=false) renders NO NetworkPolicy. Render first so a helm failure aborts
          # instead of being swallowed by `|| true` and misread as "0 NetworkPolicy = correctly off".
          default_render=$("$H" template t ./dist/chart -n default)
          off=$(grep -c '^kind: NetworkPolicy' <<<"$default_render" || :)
          [ "$off" = "0" ] || { echo "FAIL: networkPolicy.enable=false must render 0 NetworkPolicy, got $off"; exit 1; }
          # (b) enable=true renders the policy; the live API server normalizes it (server-side dry-run) to
          # JSON, then jq asserts the required rules SCOPED TO .spec.egress. Scoping to .spec.egress (not a
          # whole-YAML grep) means an ingress port cannot satisfy an egress assertion, and a port dropped
          # from egress but still present in ingress is still caught — the exact ingress/egress confusion a
          # substring grep would miss. Ingress and egress are opposite directions; for an egress-isolated pod
          # only .spec.egress is the outbound allowlist.
          np=$($H template t ./dist/chart -n default --set networkPolicy.enable=true \
                 --show-only templates/manager/networkpolicy.yaml)
          echo "$np" | grep -q '^kind: NetworkPolicy' || { echo "FAIL: enable=true must render a NetworkPolicy"; exit 1; }
          obj=$(printf '%s\n' "$np" | kubectl apply --dry-run=server -f - -o json)
          # A NetworkPolicy egress rule matches ports AND to; a rule with no 'to' allows the port to ALL
          # destinations. The chart's default rules for these ports are 'to'-less (broad), so require each
          # required port to appear in a 'to'-LESS egress rule — otherwise a mutation that scopes the 443
          # rule to some ipBlock CIDR would still list 443/TCP yet block apiserver/CelesTrak/Space-Track.
          echo "$obj" | jq -e '
            .kind == "NetworkPolicy"
            and (.spec.policyTypes | index("Egress"))
            # The podSelector must actually select the manager pods: a typo (e.g. control-plane: typoo) is
            # accepted by the API server yet the policy protects ZERO pods — a silent isolation bypass.
            and (.spec.podSelector.matchLabels["control-plane"] == "controller-manager")
            and (.spec.podSelector.matchLabels["app.kubernetes.io/name"] == "ntn-operators")
            # EXACT set (not subset) of the "to"-less (all-destinations) egress ports. A subset check would
            # let an added 22/2375/10250 through; the exact set also catches a dropped required port. A rule
            # scoped to some ipBlock CIDR does NOT count — .to must be empty (broad) for apiserver/CelesTrak/
            # Space-Track/Prometheus/gNB reachability.
            and ([ .spec.egress[]? | select((.to // []) | length == 0) | .ports[]? | "\(.port)/\(.protocol // "TCP")" ] | unique
                  == (["53/TCP","53/UDP","443/TCP","9090/TCP","8001/TCP"] | unique))
          ' >/dev/null \
            || { echo "FAIL: NetworkPolicy must select the manager (control-plane=controller-manager, app.kubernetes.io/name=ntn-operators) and its 'to'-less .spec.egress must be EXACTLY {53/TCP,53/UDP,443/TCP,9090/TCP,8001/TCP}"; echo "$obj" | jq '{podSelector: .spec.podSelector, egress: .spec.egress}'; exit 1; }
          echo "NetworkPolicy assertion OK (server-normalized; manager selector + exact 'to'-less egress set 53 TCP+UDP, 443/9090/8001 TCP)"

      - name: Deploy manager via Helm
        # ha-ci-values.yaml adds the celestrak-mock host to --ephemeris-allowed-private-hosts so
        # TestHAOutageContinuityAcrossFailover can warm the ephemeris cache from the in-cluster mock.
        run: make helm-deploy IMG=controller:latest HELM_EXTRA_ARGS="--set manager.image.pullPolicy=Never --values test/e2e/fixtures/ha-ci-values.yaml"

      - name: Check Helm release status
        run: make helm-status

      # Assert the deployed manager runs the JUST-BUILT image, not a stale published tag. helm-deploy sets the
      # image via --set from IMG=controller:latest; if that override were ever dropped, the chart default
      # (a real published release) could deploy and the HA suite would validate OLD code. pullPolicy=Never
      # already fails that closed, but assert image identity so the guarantee does not rest on one flag.
      - name: Verify the deployed manager runs the just-built image
        run: |
          set -euo pipefail
          # Select the "manager" container BY NAME and compare EXACTLY — a substring grep over all containers
          # could be satisfied by a sidecar tagged controller:latest (or fooled by controller:latest-debug)
          # while the manager itself deployed a stale image.
          img=$(kubectl -n ntn-operators-system get deploy -l control-plane=controller-manager \
                  -o jsonpath='{.items[0].spec.template.spec.containers[?(@.name=="manager")].image}')
          echo "deployed manager container image: $img"
          [ "$img" = "controller:latest" ] \
            || { echo "FAIL: manager container image is '$img', not the built controller:latest (stale-code risk)"; exit 1; }

      # #230 items 2-5: exercise the active-passive HA behaviours against the just-deployed 2-replica
      # release — graceful failover (leader delete → standby acquires lease → new leader reconciles),
      # ungraceful failover (SIGKILL → failover within LeaseDuration), PDB eviction (evicts at most one),
      # and the cache-sync /readyz rollout gate (a broken replica stays NotReady, healthy version preserved).
      # #329: the credentialed runtime push (wss:// + bearer + mTLS) had NO end-to-end coverage —
      # everything under #206/#295/#297/#313/#318/#322 was unit-tested against httptest, which cannot
      # show the deployment shape works. Runs BEFORE the destructive HA step, which evicts pods and
      # mutates RBAC. Needs no image build: the gNB stand-in is stdlib Go run from a ConfigMap with the
      # stock golang image, and the proxy is stock nginx.
      - name: Snapshot the manager pod template
        run: |
          kubectl -n ntn-operators-system get deploy -l control-plane=controller-manager \
            -o jsonpath='{.items[0].spec.template}' > /tmp/mgr_before.json

      - name: Credentialed runtime-push E2E (wss/mTLS, #329)
        env:
          WSS_MANAGER_NAMESPACE: ntn-operators-system
        run: |
          set -euo pipefail
          make test-e2e-wss 2>&1 | tee /tmp/wss_e2e.out
          # Same false-green class the HA step guards: a build-tag typo or a rename makes
          # `go test -run '^TestWSSCredentialedPush'` match ZERO tests and exit 0.
          if grep -Eq 'no tests to run|no test files' /tmp/wss_e2e.out; then
            echo "FALSE GREEN: go test -tags=e2e_wss ran no tests"; exit 1
          fi
          grep -Eq '^--- PASS: TestWSSCredentialedPush ' /tmp/wss_e2e.out || {
            echo "FALSE GREEN: TestWSSCredentialedPush did not run+PASS"; exit 1; }
          # Each arm must RUN — a subtest silently deleted or skipped would still leave the parent PASS.
          for arm in \
            'mtls\+bearer_reaches_the_plaintext_gNB_behind_the_proxy' \
            'wrong_bearer_is_RemoteEndpointRejected' \
            'token_without_ca.crt_delivers_no_payload' \
            'dropping_the_client_certificate_is_refused_by_the_proxy' \
            'a_credential_pinning_the_wrong_CA_refuses_the_server_certificate' \
            'mode_tls_succeeds_against_a_proxy_that_wants_no_client_certificate' \
            'endpoint_outside_the_admin_allow-list_is_refused_before_the_Secret_is_read'; do
            grep -Eq "^    --- PASS: TestWSSCredentialedPush/${arm}" /tmp/wss_e2e.out || {
              echo "FALSE GREEN: arm ${arm} did not run+PASS"; exit 1; }
          done
          # The whole point is what crossed the wire. If the backend never logged a frame, the arms
          # asserted on conditions alone and the proxy chain was never exercised.
          grep -q 'frame on the wire: {"cmd":"ntn_config_update"' /tmp/wss_e2e.out || {
            echo "FALSE GREEN: no ntn_config_update frame reached the plaintext backend"; exit 1; }
          # An arm that SKIPS is not coverage. #300's arm skips when the manager has no endpoint
          # allow-list, which is correct for a stock deploy but a hole in CI, where ha-ci-values.yaml
          # sets one.
          if grep -Eq '^    --- SKIP: TestWSSCredentialedPush/' /tmp/wss_e2e.out; then
            echo "FALSE GREEN: an arm skipped; ha-ci-values.yaml is meant to satisfy every precondition"
            grep -E '^    --- SKIP' /tmp/wss_e2e.out; exit 1
          fi

      # The suite runs against the SHARED release, so it must leave the manager exactly as it found
      # it. It once appended --ephemeris-allowed-private-hosts at runtime; that flag is a plain string,
      # so the append REPLACED the celestrak-mock value and the HA step below timed out — while the wss
      # step itself stayed green. Compare the pod template, not just the args, and do it here rather
      # than trusting the test to police itself.
      - name: Manager must be untouched by the wss E2E
        run: |
          set -euo pipefail
          kubectl -n ntn-operators-system get deploy -l control-plane=controller-manager \
            -o jsonpath='{.items[0].spec.template}' > /tmp/mgr_after.json
          diff <(jq -S . /tmp/mgr_before.json) <(jq -S . /tmp/mgr_after.json) || {
            echo "the wss E2E mutated the shared manager Deployment; configure it in ha-ci-values.yaml instead"
            exit 1; }

      # These are DESTRUCTIVE (kill/evict pods, briefly break RBAC) so they run last, after the chart
      # validations above. The suite self-heals to 2 ready replicas between cases.
      - name: HA failover / PDB / cache-sync E2E (#230)
        env:
          HA_NAMESPACE: ntn-operators-system
          HA_ALLOW_DESTRUCTIVE: "1"    # explicit opt-in — the suite cordons nodes, evicts pods, mutates cluster RBAC
          HA_EXPECT_KIND: "1"          # refuse to run unless EVERY node is a disposable Kind node
          HA_REQUIRE_UNGRACEFUL: "1"   # the ungraceful SIGKILL test must RUN — a skip is a FAILURE here, not green
          HA_REQUIRE_RUN: "1"          # a missing HA_ALLOW_DESTRUCTIVE must FAIL here, not skip every test to green
        run: |
          set -euo pipefail
          make test-e2e-ha 2>&1 | tee /tmp/ha_e2e.out
          # Guard the ONE false-green the HA_REQUIRE_* env vars cannot: those live INSIDE newHAEnv, so if a
          # build-tag typo or a TestHA* rename makes `go test -run '^TestHA'` match ZERO tests, it exits 0 and
          # every guard is bypassed. Assert go test did not no-op AND each expected test actually PASSED (also
          # catches a SKIP, which prints "--- SKIP" not "--- PASS").
          if grep -Eq 'no tests to run|no test files' /tmp/ha_e2e.out; then
            echo "FALSE GREEN: go test -tags=e2e_ha ran no tests"; exit 1
          fi
          # DERIVE the TestHA* set from the compiled binary so a NEW HA test or a rename is auto-covered, then
          # assert each derived test actually PASSED (the trailing space stops a prefix like TestHAGraceful
          # from matching TestHAGracefulFailover). A build-tag typo makes the list empty -> caught below.
          mapfile -t HATESTS < <(go test -tags=e2e_ha ./test/e2e/ -list '^TestHA' 2>/dev/null | grep '^TestHA' || true)
          for tc in "${HATESTS[@]}"; do
            grep -Eq "^--- PASS: ${tc} " /tmp/ha_e2e.out || { echo "FALSE GREEN: ${tc} did not run+PASS"; exit 1; }
          done
          # The derived list only proves whatever CURRENTLY compiles passed; it cannot notice that a
          # known-critical test was DELETED (a shorter list still passes). Pin the acceptance contract: these
          # five MUST each run+PASS. Deleting/renaming/skipping one fails here instead of silently going green.
          # (Also subsumes the old '>= 4' floor: five present-and-passing means at least five ran.)
          REQUIRED_HATESTS=(
            TestHAGracefulFailover
            TestHAUngracefulFailover
            TestHAPDBEviction
            TestHACacheSyncRolloutGate
            TestHAOutageContinuityAcrossFailover
          )
          for tc in "${REQUIRED_HATESTS[@]}"; do
            grep -Eq "^--- PASS: ${tc} " /tmp/ha_e2e.out \
              || { echo "FALSE GREEN: required acceptance test ${tc} did not run+PASS (deleted/renamed/skipped?)"; exit 1; }
          done
          echo "verified: all ${#HATESTS[@]} TestHA* ran and passed (incl. the ${#REQUIRED_HATESTS[@]} required acceptance tests)"

      # On failure, dump cluster state so an HA failure (CrashLoop, probe, lease, PDB selector, rollout
      # stall, image pull, RBAC denial, informer sync, mock nginx) is diagnosable from the run itself
      # instead of needing a re-run. set +e so a failing collector never masks the real failure.
      - name: Collect failure diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          mkdir -p /tmp/diagnostics
          kubectl get all,pdb,lease,networkpolicy,validatingadmissionpolicy,validatingadmissionpolicybinding \
            -A -o wide > /tmp/diagnostics/resources.txt 2>&1
          kubectl get events -A --sort-by=.lastTimestamp > /tmp/diagnostics/events.txt 2>&1
          kubectl describe pods -n ntn-operators-system > /tmp/diagnostics/pods-describe.txt 2>&1
          kubectl logs -n ntn-operators-system -l control-plane=controller-manager \
            --all-containers --prefix --tail=-1 > /tmp/diagnostics/manager.log 2>&1
          make helm-status > /tmp/diagnostics/helm-status.txt 2>&1
          cp -f /tmp/ha_e2e.out /tmp/diagnostics/ 2>/dev/null
          echo "===== manager.log (tail) ====="; tail -60 /tmp/diagnostics/manager.log
          echo "===== events (tail) ====="; tail -40 /tmp/diagnostics/events.txt

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ha-failure-diagnostics
          path: /tmp/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      # Explicitly tear down the Kind cluster (name "kind" from `kind create cluster`) so a reused/self-hosted
      # runner does not leak it and the post-run log stays clean. kind-action was install_only, so it manages
      # no cluster of its own to delete.
      - name: Delete Kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name kind || true
