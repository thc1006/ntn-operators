name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'cmd/**'
      - 'config/**'
      - 'test/**'
      - 'hack/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'cmd/**'
      - 'config/**'
      - 'test/**'
      - 'hack/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E on Kind
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true

      - name: Run E2E tests
        run: make test-e2e
