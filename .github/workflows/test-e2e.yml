name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'cmd/**'
      # config/** narrowed to subdirectories that actually affect
      # controller behaviour. Skips config/samples/ (sample CRs) and
      # config/grafana/ (dashboard JSON) which have zero impact on the
      # reconciler — they used to trigger e2e on doc-only PRs and
      # collide with CelesTrak network flake. If config/webhook/ or
      # other controller-affecting subdirs land later, add them here.
      - 'config/crd/**'
      - 'config/default/**'
      - 'config/manager/**'
      - 'config/network-policy/**'
      - 'config/prometheus/**'
      - 'config/rbac/**'
      - 'test/**'
      - 'hack/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'cmd/**'
      - 'config/crd/**'
      - 'config/default/**'
      - 'config/manager/**'
      - 'config/network-policy/**'
      - 'config/prometheus/**'
      - 'config/rbac/**'
      - 'test/**'
      - 'hack/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E on Kind
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Run E2E tests
        run: make test-e2e
