name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'api/**'
      - 'cmd/**'
      - 'config/**'
      - 'test/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:

jobs:
  test-e2e:
    name: E2E on Kind
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run E2E tests
        run: make test-e2e
