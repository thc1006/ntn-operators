                      velX:
                        default: 0
                        description: velX is the X velocity of the satellite (0 for
                          GEO).
                        type: integer
                      velY:
                        default: 0
                        description: velY is the Y velocity of the satellite (0 for
                          GEO).
                        type: integer
                      velZ:
                        default: 0
                        description: velZ is the Z velocity of the satellite (0 for
                          GEO).
