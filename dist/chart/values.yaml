## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Active-passive HA: 2 replicas + leader election run one active reconciler and
  ## one warm standby that takes over on failure or rollout (fast, because the
  ## operator sets LeaderElectionReleaseOnCancel). Set to 1 for single-node / dev
  ## clusters where a standby cannot be scheduled.
  replicas: 2

  image:
    repository: ghcr.io/thc1006/ntn-operators
    tag: v0.7.0
    pullPolicy: IfNotPresent

  ## Extra arguments passed to the manager binary.
  ## Note: --leader-elect defaults to true in the binary; listed here for visibility.
  ##
  args:
    - --leader-elect

  ## Maximum concurrent reconciles per controller (default: 1).
  ## Increase for large deployments (100+ ground stations, multiple constellations).
  ##
  maxConcurrentReconciles: 1

  ## Environment variables
  ##
  env: []

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity. Defaults to a SOFT pod anti-affinity that spreads the
  ## HA replicas onto different nodes when possible — "preferred", so the standby
  ## still schedules on a single-node cluster instead of hanging Pending. Override
  ## with your own affinity, or set to {} to disable spreading.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                control-plane: controller-manager

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs
  enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # Metrics server port
  port: 8443

## Cert-manager integration for TLS certificates.
## Required for the metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

## PodDisruptionBudget for high availability.
## Keeps a manager pod up across voluntary disruptions (node drain, rollout).
## Effective with replicas > 1 (the active-passive default).
##
podDisruptionBudget:
  enable: true
  minAvailable: 1

## NetworkPolicy for zero-trust pod networking.
## Ingress: metrics (8443) and health probes (8081).
## Egress: HTTPS 443 (Kubernetes API server, CelesTrak, Space-Track) and DNS 53.
## The operator ALSO reaches two data-path targets whose addresses are set
## per-CR, so they cannot be hardcoded here — leave them out and enabling this
## policy silently blackholes them:
##   - the in-cluster Prometheus that NTNSlice.spec.metricsSource.prometheus.endpoint
##     queries (default port 9090), and
##   - the gNB remote_control WebSocket that
##     NTNCellConfig.spec.provider.remoteControl.endpoint targets (host:port).
## List the ports you actually use below; use extraEgress to scope by
## namespace/CIDR if the port-only default is too broad for your policy.
## Requires a CNI plugin that implements NetworkPolicy (e.g., Calico, Cilium).
##
networkPolicy:
  enable: false
  ## Egress ports for the in-cluster Prometheus queried by NTNSlice metricsSource.
  ## Set to [] if no NTNSlice uses a prometheus metricsSource.
  prometheusPorts:
    - 9090
  ## Egress ports for the gNB remote_control WebSocket targeted by the runtime
  ## NTN push (NTNCellConfig.spec.provider.remoteControl.endpoint). Add every
  ## distinct gNB port in use; set to [] if no NTNCellConfig configures a runtime push.
  gnbPorts:
    - 8001
  ## Advanced: extra egress rules appended verbatim to spec.egress. NetworkPolicy
  ## egress rules are additive (OR'd), so these only *add* reachability — they
  ## cannot narrow the port-only rules above (prometheusPorts/gnbPorts emit
  ## rules with no `to:`, i.e. those ports to ALL destinations). To CIDR/namespace-
  ## scope a port, leave it OUT of prometheusPorts/gnbPorts and express the port
  ## AND its destination together here, so no broad port-only rule exists to OR
  ## against — e.g. to scope the gNB port to an external RAN subnet set
  ## `gnbPorts: []` and:
  ##   extraEgress:
  ##     - to:
  ##         - ipBlock:
  ##             cidr: 10.20.0.0/16
  ##       ports:
  ##         - port: 8001
  ##           protocol: TCP
  extraEgress: []

