{{- if .Values.networkPolicy.enable }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ntn-operators.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "ntn-operators.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ntn-operators.name" . }}
      control-plane: controller-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow metrics scraping (Prometheus) and health probes (kubelet)
    - ports:
        - port: 8443
          protocol: TCP
        - port: 8081
          protocol: TCP
  egress:
    # Allow HTTPS: Kubernetes API server + CelesTrak + Space-Track
    - ports:
        - port: 443
          protocol: TCP
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
    {{- with .Values.networkPolicy.prometheusPorts }}
    # Allow querying the in-cluster Prometheus (NTNSlice metricsSource reader)
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.gnbPorts }}
    # Allow the runtime NTN push to the gNB remote_control WebSocket
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    # Operator-supplied egress rules (e.g. namespace/CIDR-scoped Prometheus/gNB)
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
