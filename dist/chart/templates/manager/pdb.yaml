{{- /* Only render with replicas > 1: a minAvailable:1 PDB over a single replica blocks every
       eviction-API disruption (node drain, descheduler, autoscaler) since the one pod can never
       be evicted. PDBs do not gate Deployment rolling updates, which delete pods directly. */ -}}
{{- if and .Values.podDisruptionBudget.enable (gt (int .Values.manager.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ntn-operators.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "ntn-operators.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ntn-operators.name" . }}
      control-plane: controller-manager
{{- end }}
