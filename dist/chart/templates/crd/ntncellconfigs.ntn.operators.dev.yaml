---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ntncellconfigs.ntn.operators.dev
spec:
  group: ntn.operators.dev
  names:
    kind: NTNCellConfig
    listKind: NTNCellConfigList
    plural: ntncellconfigs
    shortNames:
    - ntncc
    singular: ntncellconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider.type
      name: Provider
      type: string
    - jsonPath: .spec.ntn.cellSpecificKoffset
      name: Koffset
      type: integer
    - jsonPath: .spec.ntn.payloadType
      name: Payload
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NTNCellConfig manages NTN-specific radio parameters for a gNB cell,
          delegating configuration to the specified NTN backend provider (OCUDU, OAI, Aalyria).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NTNCellConfigSpec defines the desired NTN cell configuration.
            properties:
              cellOverrides:
                description: cellOverrides allows fine-tuning PUCCH, PDSCH, PRACH,
                  and RRC parameters.
                properties:
                  pdschMaxHarqRetxs:
                    default: 0
                    description: pdschMaxHarqRetxs sets the max HARQ retransmissions
                      (0 = disabled for NTN).
                    type: integer
                  prachMaxMsg3HarqRetx:
                    default: 0
                    description: prachMaxMsg3HarqRetx sets the max msg3 HARQ retransmissions.
                    type: integer
                  rrcGuardTimeMs:
                    default: 12800
                    description: rrcGuardTimeMs sets the RRC procedure guard time
                      in ms.
                    type: integer
                type: object
              ntn:
                description: ntn contains NTN-specific radio parameters per 3GPP TS
                  38.213 / OCUDU geo_ntn.yml.
                properties:
                  cellSpecificKoffset:
                    default: 150
                    description: cellSpecificKoffset sets the cell-specific k-offset
                      for NTN (0-1023).
                    maximum: 1023
                    minimum: 0
                    type: integer
                  ephemerisECEF:
                    description: ephemerisECEF defines the satellite position and
                      velocity in ECEF coordinates.
                    properties:
                      posX:
                        description: posX is the X position of the satellite (-67108864
                          to 67108863).
                        maximum: 67108863
                        minimum: -67108864
                        type: integer
                      posY:
                        description: posY is the Y position of the satellite (-67108864
                          to 67108863).
                        maximum: 67108863
                        minimum: -67108864
                        type: integer
                      posZ:
                        description: posZ is the Z position of the satellite (-67108864
                          to 67108863).
                        maximum: 67108863
                        minimum: -67108864
                        type: integer
                      velX:
                        default: 0
                        description: velX is the X velocity of the satellite (0 for
                          GEO).
                        type: integer
                      velY:
                        default: 0
                        description: velY is the Y velocity of the satellite (0 for
                          GEO).
                        type: integer
                      velZ:
                        default: 0
                        description: velZ is the Z velocity of the satellite (0 for
                          GEO).
                        type: integer
                    required:
                    - posX
                    - posY
                    - posZ
                    type: object
                  movingRefLocation:
                    description: |-
                      movingRefLocation defines the Earth-moving reference location for LEO NTN cells.
                      3GPP Release 18 SIB19 field. Used by UEs for timing/Doppler estimation.
                    properties:
                      latitude:
                        description: latitude in 1e-4 degrees (-900000 to 900000 =
                          -90° to 90°).
                        maximum: 900000
                        minimum: -900000
                        type: integer
                      longitude:
                        description: longitude in 1e-4 degrees (-1800000 to 1800000
                          = -180° to 180°).
                        maximum: 1800000
                        minimum: -1800000
                        type: integer
                    required:
                    - latitude
                    - longitude
                    type: object
                  payloadType:
                    default: transparent
                    description: payloadType specifies the satellite payload architecture.
                    enum:
                    - transparent
                    - regenerative
                    type: string
                  satSwitchWithResync:
                    description: |-
                      satSwitchWithResync provides satellite switch handover hints to UEs during
                      satellite-to-satellite transitions. 3GPP Release 18 SIB19 field.
                    properties:
                      t304:
                        description: t304 is the handover timer value in milliseconds
                          per 3GPP TS 38.331.
                        enum:
                        - 50
                        - 100
                        - 150
                        - 200
                        - 500
                        - 1000
                        - 2000
                        - 10000
                        type: integer
                      targetPCI:
                        description: targetPCI is the Physical Cell Identity of the
                          target cell after switch (0-1007).
                        maximum: 1007
                        minimum: 0
                        type: integer
                    required:
                    - t304
                    - targetPCI
                    type: object
                  taCommon:
                    default: 0
                    description: |-
                      taCommon sets the common Timing Advance value (0-66485757).
                      Deprecated: use taInfo.taCommon instead. Kept for backward compatibility;
                      if taInfo is set, taInfo.taCommon takes precedence.
                    maximum: 66485757
                    minimum: 0
                    type: integer
                  taInfo:
                    description: |-
                      taInfo provides extended Timing Advance parameters per 3GPP TS 38.213.
                      When set, taInfo.taCommon takes precedence over the top-level taCommon field.
                    properties:
                      taCommon:
                        default: 0
                        description: taCommon is the common Timing Advance value (0-66485757).
                        maximum: 66485757
                        minimum: 0
                        type: integer
                      taCommonDrift:
                        description: |-
                          taCommonDrift is the TA drift rate in units of TA per second.
                          Used for LEO satellites where TA changes continuously.
                        type: integer
                      taCommonDriftVariant:
                        description: taCommonDriftVariant is the TA drift rate variant.
                        type: integer
                      taCommonOffset:
                        description: taCommonOffset is an additional TA offset.
                        type: integer
                    type: object
                required:
                - ephemerisECEF
                type: object
                x-kubernetes-validations:
                - message: ephemerisECEF position must not be all zeros
                  rule: self.ephemerisECEF.posX != 0 || self.ephemerisECEF.posY !=
                    0 || self.ephemerisECEF.posZ != 0
              provider:
                description: provider specifies which NTN backend to configure.
                properties:
                  endpoint:
                    description: endpoint is the provider-specific endpoint (e.g.,
                      O1 NETCONF address).
                    type: string
                  namespace:
                    description: namespace where the provider resources (e.g., OCUDU
                      gNB) are deployed.
                    type: string
                  type:
                    description: type is the provider type.
                    enum:
                    - ocudu
                    - oai
                    - aalyria
                    type: string
                required:
                - type
                type: object
            required:
            - ntn
            - provider
            type: object
          status:
            description: NTNCellConfigStatus defines the observed state of NTNCellConfig.
            properties:
              appliedKoffset:
                description: appliedKoffset is the last successfully applied k-offset
                  value.
                type: integer
              conditions:
                description: conditions represent the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configMapRef:
                description: configMapRef is the name of the ConfigMap containing
                  the generated config.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
