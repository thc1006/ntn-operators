{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{ if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{ end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: satelliteephemeris.ntn.operators.dev
spec:
  group: ntn.operators.dev
  names:
    kind: SatelliteEphemeris
    listKind: SatelliteEphemerisList
    plural: satelliteephemeris
    shortNames:
    - sateph
    singular: satelliteephemeris
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.satelliteCount
      name: Satellites
      type: integer
    - jsonPath: .status.lastUpdated
      name: Last Updated
      type: date
    - jsonPath: .status.conditions[?(@.type=="GPDataFetched")].status
      name: Fetched
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SatelliteEphemeris manages GP data fetching (OMM JSON from CelesTrak/SpaceTrack),
          orbital propagation (SGP4 via akhenakh/sgp4), and pass prediction for a set of
          satellites against ground stations.

          Orbit-regime support: v1.0 is LEO-only. The propagator is the near-earth SGP4
          model; element sets whose orbital period is >= 225 minutes (deep space —
          roughly MEO and above, e.g. O3b or GEO) are rejected rather than propagated
          into a wrong position, and surface as the UnsupportedOrbitRegime status
          condition. Multi-orbit (MEO/GEO) support is a v1.1 roadmap item.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SatelliteEphemerisSpec defines the desired state of SatelliteEphemeris.
            properties:
              passPrediction:
                description: passPrediction configures automatic pass window computation.
                properties:
                  groundStations:
                    description: |-
                      groundStations is a list of GroundStationLifecycle resource names
                      to compute pass windows against.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                  horizon:
                    default: 24h
                    description: horizon is how far into the future to predict passes.
                    type: string
                  minElevation:
                    default: "10"
                    description: minElevation is the minimum elevation angle in degrees
                      (string, e.g., "10").
                    maxLength: 32
                    pattern: ^-?[0-9]+\.?[0-9]*$
                    type: string
                required:
                - groundStations
                type: object
              satellites:
                description: satellites filters which satellites to track from the
                  source.
                properties:
                  constellation:
                    description: |-
                      constellation is DEPRECATED and performs no filtering at all — the controller
                      has never consumed it (neither server- nor client-side). Select a constellation
                      in the source URL instead (CelesTrak's GROUP= query parameter, e.g. GROUP=oneweb,
                      returns only that constellation's element sets) and/or list explicit noradIDs.
                      It stays accepted in v1alpha1; removal is deferred to a future versioned API
                      migration — a v1alpha2 that drops it must ship conversion so v1alpha1<->v1alpha2
                      round-trips losslessly, plus stored-object migration and storedVersions cleanup;
                      a version rename alone is not enough to safely drop the data.

                      Deprecated: select the constellation via source.url (GROUP=) or spec.satellites.noradIDs.
                    type: string
                  noradIDs:
                    description: noradIDs is an explicit list of NORAD catalog IDs
                      to track.
                    items:
                      type: integer
                    maxItems: 512
                    type: array
                type: object
              source:
                description: source defines where to fetch GP (General Perturbations)
                  data.
                properties:
                  credentials:
                    description: |-
                      credentials is a reference to a Secret containing auth credentials
                      (required for SpaceTrack, optional for CelesTrak).
                    properties:
                      key:
                        default: password
                        description: key within the Secret data.
                        maxLength: 253
                        type: string
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        type: string
                    required:
                    - name
                    type: object
                  refreshInterval:
                    default: 4h
                    description: |-
                      refreshInterval is how often to re-fetch GP data.
                      CelesTrak updates every 2 hours; setting this below 2h wastes bandwidth.
                    format: duration
                    type: string
                  type:
                    description: 'type is the source type. Supported: "CelesTrak",
                      "SpaceTrack".'
                    enum:
                    - CelesTrak
                    - SpaceTrack
                    type: string
                  url:
                    description: |-
                      url is the endpoint to fetch GP data from. Use https for any public
                      source: a cleartext http:// URL that resolves to a public IP is refused
                      at runtime (InsecureURL condition) because an on-path attacker could
                      inject forged OMM data that is propagated into SIB19. http:// is permitted
                      only for a private/in-cluster mirror (NetworkPolicy-protected).
                      For CelesTrak: https://celestrak.org/NORAD/elements/gp.php?GROUP=oneweb&FORMAT=JSON
                      For SpaceTrack: https://www.space-track.org/basicspacedata/query/class/gp/...
                    maxLength: 2048
                    minLength: 1
                    pattern: ^https?://
                    type: string
                required:
                - refreshInterval
                - type
                - url
                type: object
                x-kubernetes-validations:
                - message: SpaceTrack source type requires credentials (spec.source.credentials)
                  rule: self.type != 'SpaceTrack' || has(self.credentials)
            required:
            - source
            type: object
          status:
            description: SatelliteEphemerisStatus defines the observed state of SatelliteEphemeris.
            properties:
              conditions:
                description: conditions represent the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastUpdated:
                description: lastUpdated is when the GP data was last successfully
                  fetched.
                format: date-time
                type: string
              nextPassWindows:
                description: nextPassWindows contains upcoming contact opportunities.
                items:
                  description: PassWindow represents a predicted contact opportunity
                    between a satellite and ground station.
                  properties:
                    aos:
                      description: aos is the Acquisition of Signal time (satellite
                        rises above minElevation).
                      format: date-time
                      type: string
                    groundStation:
                      description: groundStation is the name of the GroundStationLifecycle
                        resource.
                      type: string
                    los:
                      description: los is the Loss of Signal time (satellite drops
                        below minElevation).
                      format: date-time
                      type: string
                    maxElevation:
                      description: maxElevation is the peak elevation angle during
                        the pass in degrees (string, e.g., "72.5").
                      pattern: ^-?[0-9]+\.?[0-9]*$
                      type: string
                    satellite:
                      description: satellite is the name or NORAD ID of the satellite.
                      type: string
                  required:
                  - aos
                  - groundStation
                  - los
                  - maxElevation
                  - satellite
                  type: object
                type: array
              propagatedStates:
                description: |-
                  propagatedStates holds SGP4-propagated ECEF state vectors (per satellite) at
                  the last refresh epoch, consumed by NTNCellConfig runtime ephemeris push (#176).
                  Capped (maxItems) to match the controller's maxPropagatedStates and stay well
                  under the etcd object-size limit.
                items:
                  description: |-
                    PropagatedState is a satellite state vector propagated (SGP4) to a specific
                    epoch, in the 3GPP ECEF codepoint form the runtime ephemeris push consumes.
                  properties:
                    ecef:
                      description: |-
                        ecef is the propagated position/velocity in 3GPP codepoints. The provider
                        converts these to physical SI when pushing to OCUDU.
                      properties:
                        posX:
                          description: |-
                            posX is the X position in 1.3 m/LSB codepoints (3GPP positionX-r17,
                            -33554432 to 33554431). The operator emits posX × 1.3 as metres to OCUDU.
                          maximum: 33554430
                          minimum: -33554432
                          type: integer
                        posY:
                          description: posY is the Y position in 1.3 m/LSB codepoints
                            (-33554432 to 33554431).
                          maximum: 33554430
                          minimum: -33554432
                          type: integer
                        posZ:
                          description: posZ is the Z position in 1.3 m/LSB codepoints
                            (-33554432 to 33554431).
                          maximum: 33554430
                          minimum: -33554432
                          type: integer
                        velX:
                          default: 0
                          description: |-
                            velX is the X velocity in 0.06 m/s/LSB codepoints (3GPP velocityVX-r17,
                            -131072 to 131071; 0 for GEO). The operator emits velX × 0.06 as m/s.
                          maximum: 131071
                          minimum: -131072
                          type: integer
                        velY:
                          default: 0
                          description: velY is the Y velocity in 0.06 m/s/LSB codepoints
                            (-131072 to 131071; 0 for GEO).
                          maximum: 131071
                          minimum: -131072
                          type: integer
                        velZ:
                          default: 0
                          description: velZ is the Z velocity in 0.06 m/s/LSB codepoints
                            (-131072 to 131071; 0 for GEO).
                          maximum: 131071
                          minimum: -131072
                          type: integer
                      required:
                      - posX
                      - posY
                      - posZ
                      type: object
                    epochUnixMs:
                      description: |-
                        epochUnixMs is the propagation epoch in Unix milliseconds (in the future,
                        as OCUDU's ntn_config_update requires).
                      format: int64
                      type: integer
                    noradID:
                      description: |-
                        noradID is the satellite's NORAD catalog number, used by NTNCellConfig
                        (spec.ephemerisNoradID) to select which state to push.
                      type: integer
                    satellite:
                      description: |-
                        satellite is the satellite name or object ID (bounded; the controller
                        truncates the externally-sourced name to this length).
                      maxLength: 64
                      type: string
                    sourceEpochUnixMs:
                      description: |-
                        sourceEpochUnixMs is the epoch of the SOURCE orbital element set (the OMM EPOCH)
                        this state was propagated FROM, in Unix milliseconds. Unlike epochUnixMs (the
                        future propagation target), this is the element-set age used by the runtime-push
                        consumer to refuse pushing THIS satellite's drifting elements — a per-satellite
                        freshness bound, so a stale sibling in the same SatelliteEphemeris does not block
                        this one. 0 means the source epoch could not be parsed (treated as unknown, not
                        stale).
                      format: int64
                      type: integer
                  required:
                  - ecef
                  - epochUnixMs
                  - noradID
                  - satellite
                  type: object
                maxItems: 128
                type: array
              propagatedStatesInputHash:
                description: |-
                  propagatedStatesInputHash is a digest of the spec fields that determine WHICH
                  orbital data is fetched and WHICH satellites are propagated (source type/url and the
                  NORAD selector) — NOT the whole spec. It is stamped whenever the current
                  propagatedStates are (re)computed, from a fresh fetch or a valid same-generation
                  cache. The NTNCellConfig runtime-push consumer recomputes the hash from the live
                  spec and refuses to push when it differs — i.e. the persisted states were computed
                  under different propagation inputs (a source/selector edit whose re-propagate has
                  not yet succeeded), WITHOUT falsely invalidating on a pass-prediction-only edit
                  (#204-G1). Empty means the states predate this field (never re-propagated since
                  upgrade) or no successful reconcile yet.
                type: string
              satelliteCount:
                description: satelliteCount is the number of satellites currently
                  tracked.
                type: integer
              truncatedSatelliteCount:
                description: |-
                  truncatedSatelliteCount is how many selected satellites were NOT propagated
                  because the maxPropagatedStates cap (128) had already been reached — the count
                  actually dropped by the cap, not merely (selected - 128), so satellites that
                  fail SGP4 propagation do not inflate it. ABSENT or 0 means nothing was dropped
                  (the field is omitempty). Narrow spec.satellites.noradIDs or the source URL's
                  GROUP= to eliminate it. Mirrored by the StatesTruncated condition; a Warning
                  StatesTruncated event fires once per transition into the truncated state.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
