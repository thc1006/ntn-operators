{{- if .Values.prometheus.enable }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ntn-operators.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.prometheus.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "ntn-operators.resourceName" (dict "suffix" "alerts" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: ntn-operators.ephemeris
      rules:
        # An element set old enough that its SGP4 propagation is drifting is being
        # pushed into SIB19 (findings.md I-17/I-19). Pairs with EphemerisEpochStale.
        - alert: NTNEphemerisEpochStale
          expr: ntn_operators_ephemeris_epoch_stale_count > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SatelliteEphemeris {{`{{ $labels.namespace }}/{{ $labels.ephemeris }}`}} is propagating stale elements"
            description: "{{`{{ $value }}`}} tracked element set(s) have an epoch older than the freshness bound; the ECEF pushed to the gNB is drifting."
        # Deep-space (MEO/GEO) element sets are being dropped by the LEO-only guard
        # (findings.md B-5). A fleet expecting MEO/GEO coverage would silently lose it.
        - alert: NTNDeepSpaceElementsRejected
          expr: ntn_operators_gp_deep_space_rejected_count > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SatelliteEphemeris {{`{{ $labels.namespace }}/{{ $labels.ephemeris }}`}} is rejecting deep-space element sets"
            description: "{{`{{ $value }}`}} tracked element set(s) are MEO/GEO (period >= 225 min); v1.0 is LEO-only."
        # No successful GP fetch is producing satellites — the pipeline is dark.
        - alert: NTNNoSatellitesTracked
          expr: ntn_operators_gp_satellite_count == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "SatelliteEphemeris {{`{{ $labels.namespace }}/{{ $labels.ephemeris }}`}} tracks zero satellites"
            description: "The latest GP fetch produced no satellites for 30m."
        # The GP pipeline has NEVER produced usable element data (fetcher setup /
        # credentials failing, or every fetch erroring with no cache). Unlike
        # gp_satellite_count == 0, this fires on a cold start that never fetched
        # successfully — that counter's series is absent, so `== 0` never matches.
        - alert: NTNGPFetchNotReady
          expr: ntn_operators_gp_fetch_ready == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "SatelliteEphemeris {{`{{ $labels.namespace }}/{{ $labels.ephemeris }}`}} has no usable GP data"
            description: "No usable element set (fresh fetch, 304, or cache) has been obtained for 30m — the GP pipeline may never have come up."
    - name: ntn-operators.gnb-push
      rules:
        # Runtime NTN ephemeris push to the gNB is failing (findings.md I-19). This
        # is the v0.6 WebSocket push path that ConfigApplyErrorsTotal does not cover.
        - alert: NTNEphemerisPushFailing
          expr: increase(ntn_operators_ephemeris_push_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NTNCellConfig {{`{{ $labels.namespace }}/{{ $labels.config }}`}} ephemeris push is failing ({{`{{ $labels.reason }}`}})"
            description: "Runtime NTN ephemeris push to the gNB has failed in the last 15m."
        # The push has been failing continuously — catches PERMANENT reasons
        # (EphemerisRefNotFound / PayloadMissing / EphemerisStale / ProviderPushRejected)
        # that do not requeue, so the per-failure counter above increments only once and
        # its rate alert decays. The gauge holds 0 across the whole outage regardless.
        - alert: NTNEphemerisPushNotReady
          expr: ntn_operators_ephemeris_push_ready == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NTNCellConfig {{`{{ $labels.namespace }}/{{ $labels.config }}`}} ephemeris push is not ready"
            description: "Runtime NTN ephemeris push to the gNB has been failing for 15m (covers permanent, non-requeuing failures the rate alert misses)."
        # Static provider config apply is erroring.
        - alert: NTNConfigApplyErrors
          expr: increase(ntn_operators_config_apply_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NTNCellConfig {{`{{ $labels.namespace }}/{{ $labels.config }}`}} provider apply is erroring"
            description: "Static provider config apply has failed in the last 15m."
        # The config is not verifiably applied — the durable companion to the rate alert
        # above. ConfigApplyErrorsTotal is incremented ONLY by an ApplyCellConfig failure, so
        # InternalError (no provider registry), UnsupportedProvider (unregistered type, which
        # does not even requeue) and StatusCheckFailed (post-apply verification) increment it
        # zero times and return a nil error — invisible to both the rate alert and
        # controller_runtime_reconcile_errors_total. This gauge holds 0 across all of them.
        - alert: NTNConfigApplyNotReady
          expr: ntn_operators_config_apply_ready == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NTNCellConfig {{`{{ $labels.namespace }}/{{ $labels.config }}`}} config is not verifiably applied"
            description: "NTN config apply has been unverified or failing for 15m; read the ConfigApplied condition for the reason."
    - name: ntn-operators.failover
      rules:
        # Sustained failover churn — flapping between terrestrial and satellite.
        - alert: NTNSliceFailoverFlapping
          expr: increase(ntn_operators_failover_total[15m]) > 4
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "NTNSlice {{`{{ $labels.namespace }}/{{ $labels.slice }}`}} is flapping"
            description: "More than 4 path switches in 15m ({{`{{ $value }}`}})."
    - name: ntn-operators.controller
      rules:
        # Elevated reconcile error rate across any controller.
        - alert: NTNControllerReconcileErrors
          expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m])) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Controller {{`{{ $labels.controller }}`}} reconcile error rate is elevated"
            description: "Reconcile errors > 0.1/s for 15m."
        # The SatelliteEphemeris->NTNCellConfig fan-out mapper's spec.ephemerisRef indexed lookup is
        # erroring. The index is registered startup-fatal, so this is a cache/index anomaly, not a
        # missing index. Referencing cells still re-resolve on their own requeue (self-healing), so a
        # single blip is expected noise; a rate sustained past `for` means the informer cache is
        # unhealthy. The metric is unlabeled (process-level fault) — the namespace/ephemeris is logged.
        - alert: NTNEphemerisMapperIndexErrors
          expr: increase(ntn_operators_ephemeris_mapper_index_error_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Ephemeris fan-out mapper indexed lookup is erroring"
            description: "The SatelliteEphemeris->NTNCellConfig mapper's spec.ephemerisRef index lookup has failed in the last 15m (cache/index anomaly, not a missing index). Cells re-resolve on their own requeue, but a sustained rate means the informer cache is unhealthy. See the controller Error log for the affected namespace/ephemeris."
        # ADR-0007: persisting the last-good OMM set is deliberately best-effort — a failure must
        # not fail live reconciliation. That is precisely why it needs an alert: without one the
        # cache can be failing to write for weeks and the first symptom is a restart with nothing
        # to propagate, during the upstream outage the cache exists for. One blip is expected
        # (conflict, transient apiserver error); sustained failure means restart continuity is gone.
        - alert: NTNOMMCachePersistFailing
          expr: increase(ntn_operators_omm_cache_persist_total{result!="success"}[30m]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Durable OMM cache is not being written for {{`{{ $labels.namespace }}`}}/{{`{{ $labels.ephemeris }}`}}"
            description: "Durable OMM cache writes have been failing for 30m (result={{`{{ $labels.result }}`}}). Live propagation is unaffected, but a restart or leader failover will have no last-good element set to fall back on. skipped_oversize means the tracked set exceeds the ConfigMap bound; failed means the write itself is erroring."
        # A restore that is refused is worse than one that never happens: the object is there, and
        # something about it does not check out. refused_identity on the legacy name is how a
        # pre-ADR-0007 truncation collision surfaces; refused_digest means corruption or a hand edit.
        - alert: NTNOMMCacheRestoreRefused
          expr: increase(ntn_operators_omm_cache_restore_total{result=~"refused_.*"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Durable OMM cache restore refused for {{`{{ $labels.namespace }}`}}/{{`{{ $labels.ephemeris }}`}}"
            description: "A persisted OMM cache was found but refused ({{`{{ $labels.result }}`}}). The cold start had to proceed without it. refused_identity: the object belongs to a different CR generation or source (under the legacy name, a truncation collision); refused_digest: corrupt or hand-edited payload; refused_parse: the stored element set no longer validates."
{{- end }}
