{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ntn-operators.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "ntn-operators.resourceName" (dict "suffix" "satelliteephemeris-viewer-role" "context" $) }}
rules:
- apiGroups:
  - ntn.operators.dev
  resources:
  - satelliteephemeris
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ntn.operators.dev
  resources:
  - satelliteephemeris/status
  verbs:
  - get
{{- end }}
